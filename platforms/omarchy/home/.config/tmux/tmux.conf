# Native tmux command bindings. No Omarchy Alt shortcuts or Ctrl-Space prefix.
set -g prefix C-b
set -g prefix2 None
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm*:RGB:extkeys'
set -g extended-keys on
set -g extended-keys-format csi-u
set -g focus-events on
set -g escape-time 10
set -g history-limit 50000
set -g set-clipboard on
set -g allow-passthrough on
set -g visual-activity off
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# Default command keys, opening alongside the current pane's working directory.
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Personal Mac-style copy mode, using Wayland instead of pbcopy. No plugins.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe 'wl-copy'
bind -T copy-mode-vi Enter send -X copy-pipe 'wl-copy'
bind -T copy-mode-vi C-j send -X copy-pipe 'wl-copy'
bind -T copy-mode-vi C-u send -X halfpage-up \; send -X scroll-middle
bind -T copy-mode-vi C-d send -X halfpage-down \; send -X scroll-middle
bind -T copy-mode-vi '[' send -X previous-prompt
bind -T copy-mode-vi ']' send -X next-prompt

# Keep IPython's elapsed-time pane title visible in multi-pane windows.
set -g pane-border-format ' #{pane_index}: #{pane_title} '
set-hook -g window-layout-changed \
    'if -F "#{==:#{window_panes},1}" "set-window-option pane-border-status off" "set-window-option pane-border-status top"'

# Palette only: generated by Omarchy from the selected Everforest variant.
source-file -q ~/.local/state/omarchy/current/theme/tmux.conf
