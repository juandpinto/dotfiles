# aerc.conf -- Linux (Omarchy)
#
# Linked from ~/.dotfiles/platforms/omarchy/home/.config/aerc/aerc.conf. This
# is the Linux counterpart of the Mac's root .config/aerc/aerc.conf; the two
# differ only where the platform does (openers, hooks, log paths, and the
# number column that depends on the Mac's locally patched aerc). Keep [ui],
# [viewer], [compose] and [filters] in step with the Mac file when editing.
#
# GOTCHA: aerc.conf is parsed with go-ini's inline-comment handling, which
# treats a bare `;` or `#` anywhere in a value as the start of a comment and
# silently truncates the rest. Avoid both characters in values (chain shell
# commands with && instead of ;), or wrap the whole value in backticks.

[ui]
index-format=%D %-17.17n %s
timestamp-format=2006-01-02 03:04 PM
sidebar-width=20
empty-message=(no messages)
empty-dirlist=(no folders)
mouse-enabled=true
new-message-bell=true
border-char-vertical=│
border-char-horizontal=─

# The Mac build also shows a `number` column backed by a local aerc patch
# (`{{.Number}}` as a stable 1-based list position plus `:select-line`).
# Stock aerc 0.22.0 renders {{.Number}} as a page-relative row index, which
# is misleading, so the column is omitted here. See mail.md ("Number column")
# for how to bring it back.
index-columns=flags:4,name<20%,subject,date>=

# Everforest dark/light; see mail.md for the live-switch idea. The styleset
# files are shared with the Mac (root .config/aerc/stylesets/).
styleset-name=everforest-dark

# Group replies into threads (notmuch's native threading on unified; built
# client-side from References/In-Reply-To on icloud/gmail). Display-only:
# a/d still act on the highlighted message, A/D on the whole thread. Fold
# with za / zM, unfold with zo / zR (binds.conf).
threading-enabled=true

# Unified tab only: show which real account each message belongs to, derived
# from its actual file path (a notmuch virtual folder's .Folder is the query
# name, not the message's location).
[ui:account=unified]
index-columns=flags:4,account<7,name<20%,subject,date>=
column-account={{if contains "/icloud/" .Filename}}icloud{{else if contains "/gmail/" .Filename}}gmail{{else}}?{{end}}

[viewer]
pager=bat -p
alternatives=text/plain,text/html
show-headers=false
header-layout=From|To,Cc|Bcc,Date,Subject
always-show-mime=true

[compose]
# Empty = $VISUAL, then $EDITOR (nvim), in an embedded terminal.
editor=
header-layout=To|From,Subject

[filters]
# aerc renders nothing without an explicit filter per mimetype. These are
# aerc's own shipped filters (/usr/lib/aerc/filters on Arch). `html` wraps
# w3m and, on Linux, isolates it in a network namespace (`unshare --net`) so
# opening a message can never fire tracking pixels. The leading `!` runs w3m
# interactively against the terminal instead of through the pager: cycle to
# the text/html part with Ctrl+j/Ctrl+k. Links clicked inside w3m fail by
# design -- use Ctrl+l / Ctrl+y (fzf link picker) from the viewer instead.
text/plain=colorize
text/calendar=calendar
message/delivery-status=colorize
message/rfc822=colorize
text/html=! html
.headers=colorize

[openers]
# o/O (:open) saves the part to a temp file whose extension comes from Go's
# mime table -- for text/html that is ".ehtml", which no desktop association
# knows. Rename to .html first so xdg-open resolves the default browser. {}
# is the already shell-quoted temp path (substituted once), captured in $f.
text/html=f={} && mv "$f" "$f.html" && xdg-open "$f.html"

[hooks]
# Sync as soon as the UI is up instead of showing up-to-3-minute-old mail.
# --no-block returns immediately; systemd refuses to overlap a running
# mailsync.service, so this can never collide with the timer or Ctrl+r.
aerc-startup=systemctl --user start --no-block mailsync.service

# Push an archived/trashed/moved message to the server immediately instead
# of waiting for the next timer tick. mail-deleted fires for the source
# folder and mail-added for the destination, so both ends get pushed.
# systemd-run detaches the job completely (aerc would otherwise block on
# inherited stdio), forwards aerc's two hook variables, and logs to the
# journal: `journalctl --user -t mailsync-push`.
mail-deleted=systemd-run --user --quiet --no-block --collect --setenv=AERC_ACCOUNT --setenv=AERC_FOLDER $HOME/.local/bin/mailsync-push
mail-added=systemd-run --user --quiet --no-block --collect --setenv=AERC_ACCOUNT --setenv=AERC_FOLDER $HOME/.local/bin/mailsync-push

# Always-on audit trail of every message aerc sends, independent of whether
# copy-to succeeds (two unified-tab replies were once lost without a trace).
# aerc exposes no Message-ID or body here, but this is enough to confirm a
# send happened and reconstruct who/what/when.
mail-sent=mkdir -p $HOME/.local/state/mail && echo "$(date '+%Y-%m-%d %H:%M:%S') account=$AERC_ACCOUNT from=$AERC_FROM_ADDRESS to=$AERC_TO cc=$AERC_CC subject=$AERC_SUBJECT" >>$HOME/.local/state/mail/aerc-mail-sent.log
