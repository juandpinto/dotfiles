# Theme colors are generated by Omarchy; application settings stay here.
include ~/.local/state/omarchy/current/theme/kitty.conf

# Keep Omarchy's installed font/size initially; Ctrl+Shift+F2 edits this file.
font_family JetBrainsMono Nerd Font
bold_italic_font auto
font_size 9.0
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close -1

# Match the Mac's WezTerm background opacity without fading foreground text.
background_opacity 0.93
dynamic_background_opacity yes
# Request blur where supported; Hyprland's looknfeel.lua sets the gentle strength.
background_blur 10

cursor_shape block
cursor_blink_interval 0
cursor_trail 3
cursor_trail_start_threshold 1
# cursor_trail_decay 0.1 0.4
enable_audio_bell no
# On Wayland, Kitty's bell alert is an activation request. Omarchy enables
# Hyprland's focus_on_activate, so a background bell (aerc's new-mail bell)
# would switch workspaces.
window_alert_on_bell no
# Native Kitty integration supplies CWD/prompt markers; our Bash hook sets titles.
shell_integration no-cursor no-title

# Reload via Omarchy/SIGUSR1. Permit local socket control, never in-band TTY RC.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}

map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
map shift+enter send_text all \x1b[13;2u
# Let applications handle Alt+Enter and unshifted Ctrl+- (Pi undo).
map alt+enter no_op
map alt+shift+enter no_op
map ctrl+minus no_op
# Zoom out with Kitty's default step; use Ctrl+X, Ctrl+U for Bash undo.
map ctrl+shift+minus change_font_size all -2.0

# Herdr/tmux own panes/windows; keep Kitty's own tab UI out of the way.
tab_bar_style hidden

# Programs Kitty launches by name are looked up here before PATH. It holds only
# our omarchy-screensaver: Omarchy's launcher runs `kitty -e omarchy-screensaver`,
# and Hyprland puts Omarchy's own bin first in PATH, so this is the one place an
# override can win. Nothing else in Kitty is affected.
exe_search_path ~/.config/kitty/exe-overrides
