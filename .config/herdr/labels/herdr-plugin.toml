id = "labels"
name = "Labels"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Sidebar numbers, clean pi titles, and tmux-style automatic tab names"
platforms = ["linux", "macos"]

# One daemon per Herdr server. Herdr runs this after the session is restored
# and again after a live handoff; the daemon exits when the server's socket goes.
[[startup]]
command = ["python3", "-B", "labels.py", "daemon", "--ensure"]

# One pass by hand, for a server that was already running when the plugin was linked.
[[actions]]
id = "sync"
title = "Refresh sidebar numbers and tab names"
contexts = ["global"]
command = ["python3", "-B", "labels.py", "sync"]
