[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = true
show_symlink   = true
scrolloff      = 5

[preview]
tab_size   = 2
max_width  = 600
max_height = 900

[[plugin.prepend_fetchers]]
# id    = "git" # Remove if Yazi > v26.1.22
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
# id    = "git" # Remove if Yazi > v26.1.22
url   = "*/"
run   = "git"
group = "git"
