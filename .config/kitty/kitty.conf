# macOS terminal settings. Linux retains its Omarchy-specific Kitty overlay.
# Kitty natively loads dark/light/no-preference-theme.auto.conf from this directory.
font_family MesloLGS Nerd Font Mono
bold_italic_font auto
font_size 14.0
window_padding_width 10
hide_window_decorations titlebar-only
confirm_os_window_close -1

background_opacity 0.93
dynamic_background_opacity yes
background_blur 10

cursor_shape block
cursor_blink_interval 0
cursor_trail 3
cursor_trail_start_threshold 1
enable_audio_bell no
shell_integration no-cursor no-title
macos_option_as_alt yes

# macOS open can inherit the calling terminal's environment. This is a fresh GUI
# terminal, not an inner pane: do not reuse another multiplexer/terminal's IDs.
env HERDR_ENV
env HERDR_SOCKET_PATH
env HERDR_PANE_ID
env HERDR_TAB_ID
env HERDR_WORKSPACE_ID
env HERDR_STARTUP_CWD
env TMUX
env TMUX_PANE
env WEZTERM_PANE
env WEZTERM_UNIX_SOCKET

# Initialize the same environment as a normal Mac shell, then attach to Herdr.
# Herdr's inner zsh panes do not read this option, so there is no autostart loop.
# Recovery shell: kitty /bin/zsh -l
shell /bin/zsh -lic "exec herdr"

# Local socket control only; terminal output must never authorize remote commands.
allow_remote_control socket-only
listen_on unix:${TMPDIR}dotfiles-kitty-{kitty_pid}

map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
map shift+enter send_text all \x1b[13;2u
map alt+enter no_op
map alt+shift+enter no_op
map ctrl+minus no_op
map ctrl+shift+minus no_op
map ctrl+underscore no_op
map ctrl+shift+underscore no_op

# Herdr owns the tab/pane interface; retain Kitty's native copy/paste shortcuts.
tab_bar_style hidden
