"$schema" = 'https://starship.rs/config-schema.json'

# Everforest (light, medium contrast) recolor of starship's stock default
# prompt. Hex values: sainnhe/everforest's official "medium" contrast light
# palette (https://github.com/sainnhe/everforest/blob/master/palette.md),
# the same one used in nvim/tmux/WezTerm/btop/eza. Deliberately does NOT
# set a custom `format` -- every module below keeps starship's built-in
# icons/wording/layout ($all), just recolored (plain bold text, no
# background chips). This is the source file for the light variant -- the
# live config is ~/.config/starship.toml, kept in sync with whichever
# variant matches the current macOS appearance by
# bin/appearance-watcher.sh's react() (see AGENTS.md's "Auto dark/light
# mode syncing" section). Don't edit ~/.config/starship.toml directly, it
# gets overwritten on every light/dark switch.

[directory]
style = "bold #35a77c" # cyan -> teal/aqua

[git_branch]
style = "bold #df69ba" # purple

[git_commit]
style = "bold #8da101" # green

[git_state]
style = "bold #dfa000" # yellow

[git_status]
style = "bold #f85552" # red

[package]
style = "bold #f57d26" # orange (208)

[python]
style = "bold #dfa000" # yellow

[nodejs]
style = "bold #8da101" # green

[rust]
style = "bold #f85552" # red

[golang]
style = "bold #35a77c" # cyan -> teal/aqua

[java]
style = "dimmed #f85552" # red dimmed

[docker_context]
style = "bold #3a94c5" # blue

[conda]
style = "bold #8da101" # green

[aws]
style = "bold #dfa000" # yellow

[gcloud]
style = "bold #3a94c5" # blue

[cmd_duration]
style = "bold #dfa000" # yellow

[jobs]
style = "bold #3a94c5" # blue

[time]
disabled = false
style = "bold #dfa000" # yellow

[character]
success_symbol = "[❯](bold #8da101)"
error_symbol = "[❯](bold #f85552)"
vimcmd_symbol = "[❮](bold #8da101)"
vimcmd_replace_one_symbol = "[❮](bold #df69ba)"
vimcmd_replace_symbol = "[❮](bold #df69ba)"
vimcmd_visual_symbol = "[❮](bold #dfa000)"
