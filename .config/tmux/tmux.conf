set-window-option -g mode-keys vi

set -g mouse on                            # click to focus panes, scroll with trackpad

# Setup 'v' to begin selection as in Vim. Copy without leaving copy mode:
# `q` remains the explicit way to return to the live bottom of the pane.
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe "pbcopy"
bind-key -T copy-mode-vi Enter send -X copy-pipe "pbcopy"
bind-key -T copy-mode-vi C-j send -X copy-pipe "pbcopy"
bind-key -T copy-mode-vi D send -X copy-pipe-end-of-line "pbcopy"

# tmux captures mouse selection because `mouse` is on. Its default drag-end
# binding uses `copy-pipe-and-cancel`, which returns the view to the bottom.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe "pbcopy"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe "pbcopy"

# Jump between prompts (shells/tools like pi emit OSC 133 "prompt" markers;
# this jumps straight to them, e.g. to previous/next user messages in pi).
bind-key -T copy-mode-vi [ send-keys -X previous-prompt
bind-key -T copy-mode-vi ] send-keys -X next-prompt

# Pass graphics protocol escape sequences (kitty, iTerm2) through to the outer terminal
set -gq allow-passthrough all
set -g visual-activity off

set -g default-terminal "tmux-256color"    # proper color support
set -ag terminal-overrides ",xterm-256color:RGB"  # true color for nvim
set -g extended-keys on                    # pass shift/ctrl/alt key combos through
set -g extended-keys-format csi-u
set -as terminal-features "xterm*:extkeys" # enable extended keys for xterm-compatible terminals
set -as terminal-features "*:sixel"         # enable sixel graphics for WezTerm inline rendering

# Work-around for starting "session numbering" (really just keybinds) at 1 instead of 0. This is a bit of a hack, but it works. 
bind-key s choose-tree -ZsK '#{?#{e|<:#{line},9},#{e|+:1,#{line}},#{?#{e|<:#{line},35},M-#{a:#{e|+:97,#{e|-:#{line},9}}},}}'

# Name windows "pi" instead of "node" when running the pi CLI. pi sets its
# pane title (OSC 2) to start with the Greek letter π, but doesn't send the
# separate \ek escape sequence tmux's automatic-rename normally looks for,
# so it falls back to the underlying process name (node). This format
# checks pane_title for that π marker first, and only falls back to the
# default automatic-rename-format behavior (pane_current_command) otherwise.
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{m:π*,#{pane_title}},pi,#{pane_current_command}}}#{?pane_dead,[dead],}'

# Start window numbering at 1
set -g base-index 1

# Start pane numbering at 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Show each pane's title (nvim sets its own via titlestring; see options.lua)
# in a border line, but only for windows with more than one pane -- a single
# pane doesn't need a label. window-layout-changed fires on every split/close/
# resize, so this toggles automatically as panes are added or removed.
set-hook -g window-layout-changed \
  'if -F "#{==:#{window_panes},1}" "set-window-option pane-border-status off" "set-window-option pane-border-status top"'

# Start in same directory when splitting windows
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Plugins
set -g @plugin 'tmux-plugins/tpm' # mandatory
set -g @plugin 'tmux-plugins/tmux-sensible' # optional recommended

# ── Everforest (active), rendered via the catppuccin/tmux engine ───────────
# catppuccin/tmux is really a generic, modular tmux status-line *rendering*
# framework (window styles, flags, a "session" widget, etc.) that happens to
# ship Catppuccin's own palette as its default colors. Those colors are just
# @thm_* options set with tmux's "only if unset" flag (see
# docs/tutorials/03-resetting-theme.md in the vendored plugin), so they can
# be overridden with a plain `set -g` after the plugin runs — which is
# exactly what everforest-{dark,light}.conf below do, reskinning it with
# Everforest's palette while keeping all of the structural config (window
# flags, rounded style, the session widget) unchanged.
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Base flavor: detect macOS appearance right now (covers a fresh server
# start or a manual `tmux source-file`). The appearance-watcher LaunchAgent
# (~/.dotfiles/bin/appearance-watcher.sh) re-sources this whole file
# whenever the OS appearance changes at runtime. This only selects which
# structural defaults the plugin falls back to before our @thm_* overrides
# below apply — the actual colors always come from everforest-{dark,light}
# .conf regardless of flavor.
if-shell '[ "$(defaults read -g AppleInterfaceStyle 2>/dev/null)" = "Dark" ]' \
  'set -g @catppuccin_flavor "mocha"' \
  'set -g @catppuccin_flavor "latte"'

# catppuccin/tmux sets its color variables (@thm_*) with tmux's "only if
# unset" flag, so once mocha's colors are set, re-running the plugin with
# flavor=latte silently does nothing — the status line would stay mocha
# forever. @catppuccin_reset forces it to unset and rebuild everything
# (including our window-style customizations below) on this run; see
# docs/tutorials/03-resetting-theme.md in the vendored plugin.
set -g @catppuccin_reset "true"
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'
set -g @catppuccin_reset "false"

# Re-apply the customizations that @catppuccin_reset just wiped, plus our
# Everforest palette override. TPM's `run` at the bottom of this file
# re-runs the plugin a second time and picks these up.
if-shell '[ "$(defaults read -g AppleInterfaceStyle 2>/dev/null)" = "Dark" ]' \
  'source-file ~/.config/tmux/everforest-dark.conf' \
  'source-file ~/.config/tmux/everforest-light.conf'

set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'          # show window name (not pane title)
set -g @catppuccin_window_current_text ' #W'  # same for active window
set -g @catppuccin_window_flags 'icon'        # show zoom/sync indicators as NF icons
set -g @catppuccin_status_background 'default' # transparent status bar bg

# Status bar modules
set -g status-right-length 100
set -g status-left-length  100
set -g status-left  ""
set -g status-right "#{E:@catppuccin_status_session}"

run '~/.config/tmux/plugins/tpm/tpm'
