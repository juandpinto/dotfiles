# vim:set ft=tmux:
#
# Everforest (dark, medium contrast) palette, overriding the @thm_* color
# variables that catppuccin/tmux's rendering engine reads. See the
# "── Everforest (active) ──" comment in tmux.conf for why this works and
# why these are plain `set -g` (not `-ogq` like the vendored theme files
# this mirrors).
#
# Hex values: sainnhe/everforest's official "medium" contrast dark palette
# (https://github.com/sainnhe/everforest/blob/master/palette.md). Catppuccin
# has more named accent slots (14) than Everforest (7), so several map onto
# the same Everforest color where they're in the same hue family.

set -g @thm_bg "#2d353b"
set -g @thm_fg "#d3c6aa"

# Colors (rosewater/flamingo/peach -> orange; pink/mauve/lavender -> purple;
# teal/sky -> aqua; sapphire -> blue; maroon -> red)
set -g @thm_rosewater "#e69875"
set -g @thm_flamingo "#e69875"
set -g @thm_pink "#d699b6"
set -g @thm_mauve "#d699b6"
set -g @thm_red "#e67e80"
set -g @thm_maroon "#e67e80"
set -g @thm_peach "#e69875"
set -g @thm_yellow "#dbbc7f"
set -g @thm_green "#a7c080"
set -g @thm_teal "#83c092"
set -g @thm_sky "#83c092"
set -g @thm_sapphire "#7fbbb3"
set -g @thm_blue "#7fbbb3"
set -g @thm_lavender "#d699b6"

# Surfaces and overlays (bg1..bg5 -> surface0..overlay1; grey0 -> overlay2;
# grey1/grey2 -> subtext1/subtext0; bg_dim -> mantle/crust, since Everforest
# only has one recessed background tier where Catppuccin has two)
set -g @thm_subtext_1 "#859289"
set -g @thm_subtext_0 "#9da9a0"
set -g @thm_overlay_2 "#7a8478"
set -g @thm_overlay_1 "#56635f"
set -g @thm_overlay_0 "#4f585e"
set -g @thm_surface_2 "#475258"
set -g @thm_surface_1 "#3d484d"
set -g @thm_surface_0 "#343f44"
set -g @thm_mantle "#232a2e"
set -g @thm_crust "#232a2e"
