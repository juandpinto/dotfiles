# vim:set ft=tmux:
#
# Everforest (light, medium contrast) palette, overriding the @thm_* color
# variables that catppuccin/tmux's rendering engine reads. See the
# "── Everforest (active) ──" comment in tmux.conf for why this works and
# why these are plain `set -g` (not `-ogq` like the vendored theme files
# this mirrors).
#
# Hex values: sainnhe/everforest's official "medium" contrast light palette
# (https://github.com/sainnhe/everforest/blob/master/palette.md). Catppuccin
# has more named accent slots (14) than Everforest (7), so several map onto
# the same Everforest color where they're in the same hue family.

set -g @thm_bg "#fdf6e3"
set -g @thm_fg "#5c6a72"

# Colors (rosewater/flamingo/peach -> orange; pink/mauve/lavender -> purple;
# teal/sky -> aqua; sapphire -> blue; maroon -> red)
set -g @thm_rosewater "#f57d26"
set -g @thm_flamingo "#f57d26"
set -g @thm_pink "#df69ba"
set -g @thm_mauve "#df69ba"
set -g @thm_red "#f85552"
set -g @thm_maroon "#f85552"
set -g @thm_peach "#f57d26"
set -g @thm_yellow "#dfa000"
set -g @thm_green "#8da101"
set -g @thm_teal "#35a77c"
set -g @thm_sky "#35a77c"
set -g @thm_sapphire "#3a94c5"
set -g @thm_blue "#3a94c5"
set -g @thm_lavender "#df69ba"

# Surfaces and overlays (bg1..bg5 -> surface0..overlay1; grey0 -> overlay2;
# grey1/grey2 -> subtext1/subtext0; bg_dim -> mantle/crust, since Everforest
# only has one recessed background tier where Catppuccin has two)
set -g @thm_subtext_1 "#939f91"
set -g @thm_subtext_0 "#829181"
set -g @thm_overlay_2 "#a6b0a0"
set -g @thm_overlay_1 "#bdc3af"
set -g @thm_overlay_0 "#e0dcc7"
set -g @thm_surface_2 "#e6e2cc"
set -g @thm_surface_1 "#efebd4"
set -g @thm_surface_0 "#f4f0d9"
set -g @thm_mantle "#efebd4"
set -g @thm_crust "#efebd4"
