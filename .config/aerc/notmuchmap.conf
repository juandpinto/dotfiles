# Query-map for the [unified] notmuch account in accounts.conf.
# Maps a display name (shown as a virtual folder in aerc) to a notmuch query.
#
# Using folder: (rather than tag:) for the folder-mirroring entries means
# they always reflect each message's *actual current* Maildir location --
# no separate tag bookkeeping needed when messages get archived/moved/synced.
# Flagged is the one exception: "flagged" genuinely is a cross-folder tag
# (IMAP \Flagged, synced via notmuch's synchronize_flags), so a tag: query
# is the correct/only way to get a true "flagged regardless of folder" view,
# matching how Mail.app's own unified "Flagged" mailbox works.

Inbox=folder:icloud/Inbox or folder:gmail/Inbox
Flagged=tag:flagged
Sent=folder:"icloud/Sent Messages" or folder:gmail/Sent
Drafts=folder:icloud/Drafts or folder:gmail/Drafts
Archive=folder:icloud/Archive or folder:gmail/Archive
Trash=folder:"icloud/Deleted Messages" or folder:gmail/Trash
Spam=folder:icloud/Junk or folder:gmail/Spam
All=path:**
