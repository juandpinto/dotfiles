# aerc binds.conf
#
# Based on aerc's own shipped defaults (config/binds.conf upstream), with
# eight deliberate changes:
#
# 1. "delete" (d/D) now means "move to Trash" everywhere except while
#    already browsing Trash/Spam, where it reverts to permanent delete. This
#    is the pattern aerc's own docs (aerc-binds(5)) recommend for exactly
#    this archive-vs-delete distinction. Combined with `restrict-delete =
#    true` in accounts.conf (which refuses outright :delete-message calls
#    outside Trash/Junk as a second safety net), this means:
#      a / A  -> archive (unchanged from default)
#      d / D  -> move to Trash (changed from default hard-delete)
#      d / D  (while inside Trash or Spam) -> permanent delete
#    iCloud's actual Trash folder is natively named "Deleted Messages" (see
#    ~/mail/README.md's folder mapping notes), so it gets its own
#    [messages:account=icloud]/[view:account=icloud] overrides below rather
#    than a generic "Trash" target that only exists for Gmail. Similarly,
#    a/A/d/D on the unified account are wired to ~/.local/bin/
#    notmuch-unified-file instead of aerc's own archive/move, which don't
#    work safely there -- see ~/mail/README.md's "Fixed: trash/archive from
#    the unified tab" section for the full story.
#
# 2. Ctrl+y/Ctrl+l (copy-link/open-link in the message viewer) now use
#    aerc's fzf-based link picker instead of requiring the URL to be typed
#    out manually. w3m's own link-following is intentionally left
#    network-isolated by the `html` filter (see aerc.conf) to stop
#    tracking-pixel/beacon requests firing just from opening a message, so
#    this is the supported way to actually follow a link -- picks it with
#    fzf, then opens with the real system browser (or copies it).
#
# 3. ti/tg/tu jump directly to the icloud/Gmail/unified tab from anywhere,
#    via :change-tab.
#
# 4. Ctrl+r manually triggers :check-mail (requires check-mail-cmd, set
#    per-account in accounts.conf), to sync on demand from within aerc.
#
# 5. F toggles the flagged state (:flag -t) in the message list and viewer
#    -- neither aerc's shipped defaults nor this file previously bound
#    anything for this at all. `f` was already taken (forward, in the
#    viewer), so this uses the capital instead, in both contexts for
#    consistency.
#
# 6. Zj/Zk and related uppercase-Z-prefixed motions forward pager keys to the
#    embedded preview pane while a split is open. A split is deliberately not
#    keyboard focusable in aerc, but :send-keys targets its visible terminal
#    directly.
#
# 7. zg/zj/zk prompt for a one-based displayed message number or a relative
#    next/previous count. The local aerc source patch adds :select-line for
#    the first of those prompts; see ~/mail/README.md for its update workflow.
#
# 8. u on unified runs the durable one-step undo journal. It restores the
#    newest journaled archive/trash action to each message's exact original
#    folder, never overwriting a conflicting file or guessing after an
#    ambiguous external change.
#
# Tracked in ~/.dotfiles. accounts.conf remains local and untracked because it
# describes this machine's accounts and identities.

<C-p> = :prev-tab<Enter>
<C-PgUp> = :prev-tab<Enter>
<C-n> = :next-tab<Enter>
<C-PgDn> = :next-tab<Enter>
\[t = :prev-tab<Enter>
\]t = :next-tab<Enter>
<C-t> = :term<Enter>
? = :help keys<Enter>
<C-c> = :prompt 'Quit?' quit<Enter>
<C-q> = :prompt 'Quit?' quit<Enter>
<C-z> = :suspend<Enter>

# Jump straight to any tab by name, regardless of which one is currently
# focused (:change-tab, confirmed against the official docs).
#
# Deliberately prefixed with `t` (for "tab"), not `g`: `g` is already bound
# alone in [messages] (:select 0, jump to top of list), and aerc fires that
# immediately rather than waiting to see if a longer sequence follows --
# so "gm", for example, actually fired as two separate keystrokes (g, then
# m, which is independently bound to :compose -- hence a blank compose tab
# appearing instead of switching accounts). `t` isn't bound alone anywhere,
# only as part of the existing `tf` (toggle-folder) sequence, so it's safe.
ti = :change-tab icloud<Enter>
tg = :change-tab gmail<Enter>
tu = :change-tab unified<Enter>:cf Inbox<Enter>

# Toggle the folder sidebar on/off (b for "bar") -- same `t`-prefix safety
# reasoning as ti/tg/tu above.
tb = :toggle-sidebar<Enter>

# Manually trigger a sync from within aerc (requires check-mail-cmd, set
# per-account in accounts.conf).
<C-r> = :check-mail<Enter>

[messages]
q = :prompt 'Quit?' quit<Enter>
. = :repeat

j = :next<Enter>
<Down> = :next<Enter>
<C-d> = :next 50%<Enter>
<C-f> = :next 100%<Enter>
<PgDn> = :next 100%<Enter>

k = :prev<Enter>
<Up> = :prev<Enter>
<C-u> = :prev 50%<Enter>
<C-b> = :prev 100%<Enter>
<PgUp> = :prev 100%<Enter>
g = :select 0<Enter>
G = :select -1<Enter>

J = :next-folder<Enter>
<C-Down> = :next-folder<Enter>
K = :prev-folder<Enter>
<C-Up> = :prev-folder<Enter>
H = :collapse-folder<Enter>
<C-Left> = :collapse-folder<Enter>
L = :expand-folder<Enter>
<C-Right> = :expand-folder<Enter>
tf = :toggle-folder<Enter>

v = :mark -t<Enter>
<Space> = :mark -t<Enter>:next<Enter>
V = :mark -v<Enter>

T = :toggle-threads<Enter>
zc = :fold<Enter>
zo = :unfold<Enter>
za = :fold -t<Enter>
zM = :fold -a<Enter>
zR = :unfold -a<Enter>
<tab> = :fold -t<Enter>

zz = :align center<Enter>
zt = :align top<Enter>
zb = :align bottom<Enter>

# The preview pane created by :split/:vsplit intentionally keeps keyboard
# focus on the message list. These uppercase-Z motions send familiar less/bat
# pager keys to that pane without giving up lower-case z for count prompts.
# They are meaningful only while a split preview is open.
Zj = :send-keys j<Enter>
Zk = :send-keys k<Enter>
Z<C-d> = :send-keys \<C-d\><Enter>
Z<C-u> = :send-keys \<C-u\><Enter>
Zg = :send-keys g<Enter>
ZG = :send-keys G<Enter>

# Prompt for a count rather than typing a full ex command. zg uses the
# one-based number shown in the `number` column; zj/zk take a relative count.
zg = :prompt 'Go to message number:' select-line<Enter>
zj = :prompt 'Next N messages:' next<Enter>
zk = :prompt 'Previous N messages:' prev<Enter>

<Enter> = :view<Enter>
d = :read<Enter>:move Trash<Enter>
D = :unmark -a<Enter>:mark -T<Enter>:read<Enter>:move Trash<Enter>
a = :archive flat<Enter>
A = :unmark -a<Enter>:mark -T<Enter>:archive flat<Enter>
F = :flag -t<Enter>

C = :compose<Enter>
m = :compose<Enter>

b = :bounce<space>

rr = :reply -a<Enter>
rq = :reply -aq<Enter>
Rr = :reply<Enter>
Rq = :reply -q<Enter>

c = :cf<space>
$ = :term<space>
! = :term<space>
| = :pipe<space>

/ = :search<space>
\ = :filter<space>
n = :next-result<Enter>
N = :prev-result<Enter>
<Esc> = :clear<Enter>

s = :split<Enter>
S = :vsplit<Enter>

pl = :patch list<Enter>
pa = :patch apply <Tab>
pd = :patch drop <Tab>
pb = :patch rebase<Enter>
pt = :patch term<Enter>
ps = :patch switch <Tab>

[messages:folder=Drafts]
<Enter> = :recall<Enter>

# iCloud's actual Trash folder is natively named "Deleted Messages" (unlike
# Gmail, which is explicitly mapped to "Trash" in ~/.config/isyncrc), so the
# generic `d`/`D` -> move Trash bindings above don't apply to it.
[messages:account=icloud]
d = :read<Enter>:move 'Deleted Messages'<Enter>
D = :unmark -a<Enter>:mark -T<Enter>:read<Enter>:move 'Deleted Messages'<Enter>

# aerc's built-in :archive/:move on the unified (notmuch) tab don't work
# safely: they resolve their destination from one static per-account config
# value with no idea which *real* account (icloud vs Gmail) a message
# actually belongs to, so they either fail outright or (worse) silently
# mis-file messages into a bogus, unsynced location. Confirmed with a real
# incident, fully recovered -- see ~/mail/README.md's "Known limitation"
# section for the full story.
#
# Fix: ~/.local/bin/notmuch-unified-file looks up each message's *actual*
# current file location via notmuch (not which tab it's viewed from),
# infers its real account from that, and moves it into that account's own
# real Archive/Trash folder -- then pushes a targeted sync so it reaches
# the server right away. Verified end-to-end against real mail (`mbsync -V`
# showed zero differences remaining between local and server afterward).
# `-b` runs it in the background: silent on success, shows a status-bar
# error if it fails (aerc checks the exit code) -- see the script's own log
# at ~/Library/Logs/notmuch-unified-file.log for full detail either way.
# The local patched aerc build then sees the script's notmuch database
# update through FSEvents and removes the message in place, without the old
# scratch-query UI blink/reset.
[messages:account=unified]
a = :pipe -mb ~/.local/bin/notmuch-unified-file archive<Enter>
A = :unmark -a<Enter>:mark -T<Enter>:pipe -mb ~/.local/bin/notmuch-unified-file archive<Enter>
d = :pipe -mb ~/.local/bin/notmuch-unified-file trash<Enter>
D = :unmark -a<Enter>:mark -T<Enter>:pipe -mb ~/.local/bin/notmuch-unified-file trash<Enter>
u = :exec /bin/sh -c '$HOME/.local/bin/notmuch-unified-file undo'<Enter>

# Restore permanent delete once actually browsing Trash/Spam/Junk (name
# varies: iCloud uses "Deleted Messages"/"Junk", Gmail's mapped locally to
# "Trash"/"Spam").
[messages:folder=Trash]
d = :choose -o y 'Permanently delete?' delete-message<Enter>
D = :delete<Enter>

[messages:folder=Deleted Messages]
d = :choose -o y 'Permanently delete?' delete-message<Enter>
D = :delete<Enter>

[messages:folder=Spam]
d = :choose -o y 'Permanently delete?' delete-message<Enter>
D = :delete<Enter>

[messages:folder=Junk]
d = :choose -o y 'Permanently delete?' delete-message<Enter>
D = :delete<Enter>

[view]
/ = :toggle-key-passthrough<Enter>/
q = :close<Enter>
O = :open<Enter>
o = :open<Enter>
S = :save<space>
| = :pipe<space>
d = :move Trash<Enter>
D = :move Trash<Enter>
A = :archive flat<Enter>
F = :flag -t<Enter>

<C-y> = :menu -lc fzf :copy-link<Enter>
<C-l> = :menu -lc fzf :open-link<Enter>

f = :forward<Enter>
rr = :reply -a<Enter>
rq = :reply -aq<Enter>
Rr = :reply<Enter>
Rq = :reply -q<Enter>

H = :toggle-headers<Enter>
<C-k> = :prev-part<Enter>
<C-Up> = :prev-part<Enter>
<C-j> = :next-part<Enter>
<C-Down> = :next-part<Enter>
J = :next<Enter>
<C-Right> = :next<Enter>
K = :prev<Enter>
<C-Left> = :prev<Enter>

# Same fix as [messages:account=icloud] above, for the message *viewer*
# specifically -- this was missed the first time around (only the message
# list got an override), which surfaced as a real error: pressing d/D
# while a message was open tried the generic `d = :move Trash<Enter>`
# above, and iCloud has no folder literally named "Trash" (it's "Deleted
# Messages"), so the move failed outright ("could not move message ...
# rename ... -> ~/mail/", an invalid empty-subfolder target).
[view:account=icloud]
d = :move 'Deleted Messages'<Enter>
D = :move 'Deleted Messages'<Enter>

# Same fix as [messages:account=unified] above, for the message viewer.
# "Trash"/"Archive" on unified are virtual queries spanning both real
# accounts, not single Maildir folders, so aerc's native :move cannot safely
# resolve either target. The helper now relies on the patched FSEvents
# watcher instead of a viewer-specific scratch-query/tab restoration step.
[view:account=unified]
a = :pipe -mb ~/.local/bin/notmuch-unified-file archive<Enter>
A = :pipe -mb ~/.local/bin/notmuch-unified-file archive<Enter>
d = :pipe -mb ~/.local/bin/notmuch-unified-file trash<Enter>
D = :pipe -mb ~/.local/bin/notmuch-unified-file trash<Enter>
u = :exec /bin/sh -c '$HOME/.local/bin/notmuch-unified-file undo'<Enter>

[view:folder=Trash]
d = :choose -o y 'Permanently delete?' delete-message<Enter>
D = :delete<Enter>

[view:folder=Deleted Messages]
d = :choose -o y 'Permanently delete?' delete-message<Enter>
D = :delete<Enter>

[view:folder=Spam]
d = :choose -o y 'Permanently delete?' delete-message<Enter>
D = :delete<Enter>

[view:folder=Junk]
d = :choose -o y 'Permanently delete?' delete-message<Enter>
D = :delete<Enter>

[view::passthrough]
$noinherit = true
$ex = <C-x>
<Esc> = :toggle-key-passthrough<Enter>

[compose]
# Keybindings used when the embedded terminal is not selected in the compose
# view
$noinherit = true
$ex = <C-x>
$complete = <C-o>
<C-k> = :prev-field<Enter>
<C-Up> = :prev-field<Enter>
<C-j> = :next-field<Enter>
<C-Down> = :next-field<Enter>
<A-p> = :switch-account -p<Enter>
<A-n> = :switch-account -n<Enter>
<tab> = :next-field<Enter>
<backtab> = :prev-field<Enter>
<C-p> = :prev-tab<Enter>
<C-PgUp> = :prev-tab<Enter>
<C-n> = :next-tab<Enter>
<C-PgDn> = :next-tab<Enter>

[compose::editor]
# Keybindings used when the embedded terminal is selected in the compose view
$noinherit = true
$ex = <C-x>
# Immediately discard the message in progress, without going through nvim's
# own :cq or the review screen. Safe to reuse Ctrl+q's "quit"-ish mnemonic
# from the global quit binding -- $noinherit means that global binding
# doesn't apply in this context anyway, so there's no real conflict.
<C-q> = :abort<Enter>
<C-k> = :prev-field<Enter>
<C-Up> = :prev-field<Enter>
<C-j> = :next-field<Enter>
<C-Down> = :next-field<Enter>
<C-p> = :prev-tab<Enter>
<C-PgUp> = :prev-tab<Enter>
<C-n> = :next-tab<Enter>
<C-PgDn> = :next-tab<Enter>

[compose::review]
# Keybindings used when reviewing a message to be sent
# Inline comments are used as descriptions on the review screen
y = :send<Enter> # Send
n = :abort<Enter> # Abort (discard message, no confirmation)
s = :sign<Enter> # Toggle signing
x = :encrypt<Enter> # Toggle encryption to all recipients
v = :preview<Enter> # Preview message
p = :postpone<Enter> # Postpone
q = :choose -o d discard abort -o p postpone postpone<Enter> # Abort or postpone
e = :edit<Enter> # Edit (body and headers)
a = :attach<space> # Add attachment
d = :detach<space> # Remove attachment

[terminal]
$noinherit = true
$ex = <C-x>

<C-p> = :prev-tab<Enter>
<C-n> = :next-tab<Enter>
<C-PgUp> = :prev-tab<Enter>
<C-PgDn> = :next-tab<Enter>
