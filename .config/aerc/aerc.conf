[ui]
# Catppuccin border characters
border-char-vertical=│
border-char-horizontal=─

# Active theme: Catppuccin Mocha (dark) or Catppuccin Latte (light).
# aerc expands $VAR in config values — set AERC_FLAVOR in your shell to
# auto-switch, or just hardcode one of the two values below.
#
# To use with dark/light auto-switching, add to your shell rc:
#   export AERC_FLAVOR=mocha  # or latte
# and change this line to:
#   styleset-name=catppuccin-$AERC_FLAVOR
#
styleset-name=catppuccin-mocha
# styleset-name=catppuccin-latte
