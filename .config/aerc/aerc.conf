[ui]

#
# Describes the format for each row in a mailbox view. This field is compatible
# with mutt's printf-like syntax.
#
# Default:
index-format=%D %-17.17n %s

#
# See time.Time#Format at https://godoc.org/time#Time.Format
#
# Default: 2006-01-02 03:04 PM (ISO 8601 + 12 hour time)
timestamp-format=2006-01-02 03:04 PM

#
# Width of the sidebar, including the border.
#
# Default: 20
sidebar-width=20

#
# Message to display when viewing an empty folder.
#
# Default: (no messages)
empty-message=(no messages)

# Show each message's current 1-based list position. These are display
# positions, so sorting, filtering, or folding threads can renumber them.
# `:select` remains zero-based: visible line 42 is `:select 41`.
index-columns=number>5,flags:4,name<20%,subject,date>=
column-number={{.Number}}

# Message to display when no folders exists or are all filtered
#
# Default: (no folders)
empty-dirlist=(no folders)

# Enable mouse events in the ui, e.g. clicking and scrolling with the mousewheel
#
# Default: false
mouse-enabled=true

#
# Ring the bell when new messages are received
#
# Default: yes
new-message-bell=true
# Everforest border characters
border-char-vertical=│
border-char-horizontal=─

# Active theme: Everforest Dark or Everforest Light.
# aerc expands $VAR in config values — set AERC_FLAVOR in your shell to
# auto-switch, or just hardcode one of the two values below.
#
# To use with dark/light auto-switching, add to your shell rc:
#   export AERC_FLAVOR=dark  # or light
# and change this line to:
#   styleset-name=everforest-$AERC_FLAVOR
#
styleset-name=everforest-dark
# styleset-name=everforest-light

# Group replies into threads (by References/In-Reply-To, or by notmuch's
# own native threading on the unified tab). Not supported natively by
# IMAP, so icloud/gmail build threads client-side automatically -- this is
# purely a *display* grouping either way, it doesn't change what a/d act
# on (see binds.conf: plain a/d always act on just the highlighted
# message, even mid-thread; A/D mark and act on the whole thread). Fold an
# individual thread with za, or all of them with zM (unfold: zo / zR) --
# already bound in binds.conf.
threading-enabled=true

# Unified tab only: show which real account (icloud/gmail) each message
# belongs to, derived from its actual current folder path (e.g.
# "icloud/Inbox" -> "icloud") -- icloud/gmail's own tabs don't need this
# since every message there is obviously that one account.
[ui:account=unified]
index-columns=number>5,flags:4,account<7,name<20%,subject,date>=
column-number={{.Number}}
column-account={{if contains "/icloud/" .Filename}}icloud{{else if contains "/gmail/" .Filename}}gmail{{else}}?{{end}}

[viewer]

#
# Specifies the pager to use when displaying emails. Note that some filters
# may add ANSI codes to add color to rendered emails, so you may want to use a
# pager which supports ANSI codes.
#
# Default: less -R
# pager=less -R
pager=bat -p

#
# If an email offers several versions (multipart), you can configure which
# mimetype to prefer. For example, this can be used to prefer plaintext over
# html emails.
#
# Default: text/plain,text/html
alternatives=text/plain,text/html

#
# Default setting to determine whether to show full headers or only parsed
# ones in message viewer.
#
# Default: false
show-headers=false

#
# Layout of headers when viewing a message. To display multiple headers in the
# same row, separate them with a pipe, e.g. "From|To". Rows will be hidden if
# none of their specified headers are present in the message.
#
# Default: From|To,Cc|Bcc,Date,Subject
header-layout=From|To,Cc|Bcc,Date,Subject

# Whether to always show the mimetype of an email, even when it is just a single part
#
# Default: false
always-show-mime=true

[compose]

#
# Specifies the command to run the editor with. It will be shown in an embedded
# terminal, though it may also launch a graphical window if the environment
# supports it. Defaults to $EDITOR, or vi.
editor=

#
# Default header fields to display when composing a message. To display
# multiple headers in the same row, separate them with a pipe, e.g. "To|From".
#
# Default: To|From,Subject
header-layout=To|From,Subject

[filters]
# Without an explicit filter, aerc can't render *any* mimetype, including
# plain text -- these are aerc's own recommended defaults (shipped
# commented-out in its example config), just switched on. w3m (for HTML)
# and the rest are already installed via Homebrew.
#
# text/plain is what most multipart/alternative emails show by default;
# cycle to the text/html part with Ctrl+j/Ctrl+k (already bound in
# binds.conf) to see it rendered interactively via w3m instead (scrollable,
# follows links, images if w3m supports them) -- w3m runs directly against
# the terminal here (the leading `!`) rather than through aerc's pager.
# Network access is disabled by this script to stop remote
# tracking-pixel/beacon requests from firing just by opening a message.
#
# To open the actual HTML rendering in a real browser instead, `o`/`O`
# (:open, already bound in binds.conf) saves the current part to a temp
# file and opens it with the system default handler -- see [openers]
# below for why that needs a small assist on this machine.
text/plain=colorize
text/calendar=calendar
message/delivery-status=colorize
message/rfc822=colorize
text/html=! html

# Post-processes headers when [viewer].show-headers=true.
.headers=colorize

[openers]
# `o`/`O` (:open) saves the current MIME part to a temp file named
# aerc-<random>/aerc-<random><ext>, where <ext> comes from Go's stdlib
# mime.ExtensionsByType() picking the *first* (alphabetically) extension
# registered for the part's mimetype -- for text/html that's ".ehtml"
# (yes, really: Go's builtin table maps .ehtml/.htm/.html/.shtml all to
# text/html, sorted alphabetically, so .ehtml wins), not the expected
# ".html". macOS's LaunchServices has no app registered for the bare
# ".ehtml" extension, so falling through to the system default handler
# (`open`, aerc's own darwin fallback when no [openers] entry matches)
# fails outright with "kLSApplicationNotFoundErr" / exit status 1 --
# confirmed via `open` directly on a manually-created .ehtml file.
#
# Fix: rename the temp file to a .html sibling before handing it to
# `open`, so LaunchServices resolves it normally against whatever the
# actual current default browser is (no hardcoded app name here, so this
# keeps working if the default browser is ever changed). {} is replaced
# with the already shell-quoted temp file path (once only -- aerc only
# substitutes the first occurrence), captured into $f so it can be reused.
#
# Backtick-quoted for the same reason as aerc-startup in [hooks] below:
# this value contains a literal `;`, which go-ini's default inline-comment
# handling silently truncates on (see that section's comment for the full
# mechanism). Confirmed this was actually happening here too: without the
# backticks, `o`/`O` looked like it silently did nothing at all -- aerc
# was really running the truncated `f={}` as the entire command, a
# harmless no-op variable assignment, with no error and no sign in the UI
# that the rest of the value had been cut off.
text/html=`f={}; mv "$f" "$f.html" && open "$f.html"`

[hooks]
# GOTCHA, confirmed the hard way (see ~/mail/README.md): aerc.conf is
# parsed with go-ini's default inline-comment handling, which treats a
# bare `;` or `#` *anywhere* in a value -- not just at the start of a
# line, and with no awareness of shell syntax -- as the start of a
# comment, silently truncating everything after it. A hook that chains
# multiple shell commands with `;` (like aerc-startup below once did)
# gets silently cut down to its first fragment and never actually runs as
# written -- no parse error, no warning, nothing in aerc's own log unless
# log-level=trace is on. Wrap any value containing a literal `;` or `#` in
# backticks (always treated as literal quoting by this parser, regardless
# of any option) to protect it, as aerc-startup does below.
#
# Kick off a sync the moment aerc's UI comes up, rather than showing
# whatever's on disk from up to 3 minutes ago (the launchd timer's
# interval) with no indication it might be stale. Reuses the same
# lock-guarded mailsync script as the timer and Ctrl+r -- confirmed
# self-healing and safe to fire concurrently with either, worst case it
# just no-ops with "already running, skipping" in the log.
#
# aerc-startup fires "as soon as the UI is initialized" but before
# accounts finish their own initial folder listing -- confirmed a real,
# reproducible race where mbsync renames a file (maildir's normal new/ ->
# cur/ move) at the exact moment aerc is mid-listing that same directory,
# leaving an "error: could not get MessageInfo" row in the message list
# until something forces a real re-query. The `sleep 2` below is a cheap,
# purely complementary risk-reducer (gives aerc's own fast local listing a
# head start before mbsync starts touching files, shrinking how often the
# race actually happens) -- it is deliberately *not* relied on as the
# actual fix. An earlier version of this hook also chained an
# aerc-refresh-view call here to paper over this one race -- turns out it
# never actually ran at all: it was silently truncated by the ini-parsing
# gotcha noted at the top of this section (the `;` separating it from
# `mailsync` was read as a comment start), so every earlier "confirmed
# working" observation of this hook was actually just the independent
# 3-minute background timer coincidentally firing around the same time --
# not this hook. Once caught and fixed (backtick-quoting the whole value),
# the safety-net call was removed anyway rather than re-added, since it's
# unnecessary now that the local patched aerc build observes notmuch's
# Xapian changes through a corrected macOS FSEvents watcher. That fixes the
# underlying watcher bug rather than periodically forcing a visible
# scratch-query refresh; see ~/mail/README.md for the patch and update
# procedure.
#
# Backgrounded with the same explicit stdio redirects as the hooks below
# and for the same reason (see mail-deleted/mail-added's comment) --
# nothing here should ever block aerc's own startup.
aerc-startup=`(sleep 2; $HOME/.local/bin/mailsync >>$HOME/Library/Logs/mailsync.out.log 2>>$HOME/Library/Logs/mailsync.err.log) </dev/null &`

# Push a moved/archived/trashed message to the server immediately, instead
# of waiting for the next scheduled `mailsync` run (every 3 minutes via
# launchd). mail-deleted fires for the source folder and mail-added for the
# destination folder whenever aerc moves a message, so both ends of an
# archive/trash action get pushed right away.
#
# IMPORTANT: the trailing `&` alone does NOT fully detach this from aerc.
# The backgrounded process (and everything it spawns -- mbsync, notmuch,
# op) still inherits aerc's stdin/stdout/stderr unless explicitly
# redirected away, and aerc almost certainly captures hook output via a
# pipe that only sees EOF once *every* process holding it closes --
# including this backgrounded chain. Without the redirects below, aerc
# freezes for the entire duration of the background job (observed:
# indefinitely, while waiting on a 1Password prompt). Logs go to
# ~/Library/Logs/mailsync-push.log instead of being silently discarded.
mail-deleted=$HOME/.local/bin/mailsync-push </dev/null >>$HOME/Library/Logs/mailsync-push.log 2>&1 &
mail-added=$HOME/.local/bin/mailsync-push </dev/null >>$HOME/Library/Logs/mailsync-push.log 2>&1 &

# No flag-changed/tag-modified refresh hooks: the local patched aerc build
# observes its own and external notmuch database writes natively. Keeping
# the old scratch-query hooks would reintroduce the unified-view blink and
# selection reset they were originally added to mask.

# Lightweight, always-on audit trail for every message aerc actually sends,
# on any account -- independent of whether copy-to ever succeeds. aerc
# only exposes AERC_ACCOUNT/AERC_ACCOUNT_BACKEND/AERC_FROM_ADDRESS/
# AERC_SUBJECT/AERC_TO/AERC_CC here (no Message-ID, file path, or body), so
# this can't recover a lost message on its own -- but it's enough to
# independently confirm a send actually happened and reconstruct who/what/
# when to follow up with a recipient by hand. Added after two real replies
# sent from the unified tab were confirmed permanently lost with no local
# or server-side trace anywhere; see ~/mail/README.md's "Fixed: lost sent
# replies from the unified tab" for the full story and the copy-to fix
# (accounts.conf) this pairs with.
mail-sent=echo "$(date '+%Y-%m-%d %H:%M:%S') account=$AERC_ACCOUNT from=$AERC_FROM_ADDRESS to=$AERC_TO cc=$AERC_CC subject=$AERC_SUBJECT" >>$HOME/Library/Logs/aerc-mail-sent.log
